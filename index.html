<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维码生成</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #004c97;
            color: #fff;
            padding: 16px 24px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 24px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        label {
            font-weight: bold;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .grid {
            display: flex;
            flex: 1;
            gap: 24px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1 1 280px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .qr-box {
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            border: 1px dashed #ccc;
            border-radius: 8px;
        }

        .url-text {
            word-break: break-all;
            font-size: 14px;
            color: #555;
            text-align: center;
            min-height: 40px;
        }

        .placeholder {
            color: #888;
            font-style: italic;
        }

        footer {
            padding: 12px 24px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>链接二维码生成器</h1>
        </header>

        <main>
            <div class="input-group">
                <label for="userId">活动 ID：</label>
                <input id="userId" type="text" placeholder="请输入活动 ID，例如：12409" />
                <span id="status" class="placeholder">填写 ID 后自动生成二维码（每 3 秒刷新时间戳）。</span>
            </div>

            <div class="grid">
                <div class="card">
                    <div class="title">签到二维码</div>
                    <div id="signInQr" class="qr-box"></div>
                    <div id="signInLink" class="url-text placeholder">等待输入 ID</div>
                </div>
                <div class="card">
                    <div class="title">签退二维码</div>
                    <div id="signOutQr" class="qr-box"></div>
                    <div id="signOutLink" class="url-text placeholder">等待输入 ID</div>
                </div>
            </div>
        </main>

        <footer>
            二维码每 3 秒刷新一次时间戳。
        </footer>
    </div>
    <script>
        const baseUrl = "https://erke.gdut.edu.cn/public/index.php/mobile/activity-sign-result";
        const idInput = document.getElementById("userId");
        const status = document.getElementById("status");
        const signInLink = document.getElementById("signInLink");
        const signOutLink = document.getElementById("signOutLink");
    
        const signInQrContainer = document.getElementById("signInQr");
        const signOutQrContainer = document.getElementById("signOutQr");
    
        const signInQRCode = new QRCode(signInQrContainer, {
            width: 240,
            height: 240,
        });
    
        const signOutQRCode = new QRCode(signOutQrContainer, {
            width: 240,
            height: 240,
        });
    
        /**
         * 从输入内容中获取活动 ID
         *
         * 支持：
         * 1. 直接输入 ID：
         *    12409
         *
         * 2. 输入活动详情链接：
         *    https://erke.gdut.edu.cn/public/index.php/mobile/activity-detail?id=16121&is_from_work=true
         *
         * 返回：
         * - 成功：ID 字符串
         * - 失败：null
         */
        const getActivityId(input) { 
            const value = input.trim(); 
            // 如果本身就是纯数字，直接作为 ID 
            if (/^\d+$/.test(value)) { return value; } // 否则直接匹配 ?id=数字 或 &id=数字 
            const match = value.match(/[?&]id=(\d+)/i); 
            return match ? match[1] : null; 
        }
    
        const clearQRCodes = () => {
            signInQRCode.clear();
            signOutQRCode.clear();
    
            signInLink.textContent = "等待输入 ID 或活动链接";
            signOutLink.textContent = "等待输入 ID 或活动链接";
    
            signInLink.classList.add("placeholder");
            signOutLink.classList.add("placeholder");
    
            status.textContent = "填写 ID 或活动链接后自动生成二维码（每 3 秒刷新时间戳）。";
        };
    
        const updateQRCodes = () => {
            const rawInput = idInput.value.trim();
    
            if (!rawInput) {
                clearQRCodes();
                return;
            }
    
            // 获取活动 ID
            const activityId = getActivityId(rawInput);
    
            if (!activityId) {
                signInQRCode.clear();
                signOutQRCode.clear();
    
                signInLink.textContent = "无法识别活动 ID";
                signOutLink.textContent = "无法识别活动 ID";
    
                signInLink.classList.add("placeholder");
                signOutLink.classList.add("placeholder");
    
                status.textContent = "请输入正确的活动 ID，或粘贴完整的活动详情链接。";
                return;
            }
    
            const timestamp = Date.now().toString();
    
            const signInUrl =
                `${baseUrl}?id=${encodeURIComponent(activityId)}&type=in&ts=${timestamp}`;
    
            const signOutUrl =
                `${baseUrl}?id=${encodeURIComponent(activityId)}&type=out&ts=${timestamp}`;
    
            signInQRCode.clear();
            signOutQRCode.clear();
    
            signInQRCode.makeCode(signInUrl);
            signOutQRCode.makeCode(signOutUrl);
    
            signInLink.textContent = signInUrl;
            signOutLink.textContent = signOutUrl;
    
            signInLink.classList.remove("placeholder");
            signOutLink.classList.remove("placeholder");
    
            status.textContent =
                `已识别活动 ID：${activityId}，二维码已生成，时间戳：${timestamp}`;
        };
    
        idInput.addEventListener("input", updateQRCodes);
    
        // 每 3 秒刷新一次时间戳
        setInterval(updateQRCodes, 3000);
    
        clearQRCodes();
    </script>
</body>
</html>
